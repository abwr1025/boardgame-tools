# 桌游工具站容器
# 启动：docker compose -f deploy/docker-compose.yml up -d --build
# 访问：http://127.0.0.1:8081
#
# 注意：本容器只是本地预览与自托管用途。线上环境仍按 DEPLOY.md 使用
# Cloudflare Workers 部署，两者产物同为 dist 目录。
name: boardgame-tools

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: boardgame-tools:local
    container_name: boardgame-tools
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8081:80"